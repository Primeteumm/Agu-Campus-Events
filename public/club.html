<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Profile — AGÜ Campus Events</title>
    <meta name="description" content="Explore the club profile, upcoming events, team members, and more on AGÜ Campus Events.">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@0.474.0"></script>
</head>

<body>
<div class="app-shell">

    <!-- ═══════════════ NAVBAR ═══════════════ -->
    <nav class="navbar">
        <a href="/" class="navbar-brand club-back-link" style="text-decoration:none;">
            <svg class="navbar-brand-logo" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="36" height="36" rx="10" fill="#25282C"/>
                <rect x="8" y="10" width="20" height="17" rx="3" stroke="#00F2FF" stroke-width="1.8" fill="none"/>
                <line x1="8" y1="15" x2="28" y2="15" stroke="#00F2FF" stroke-width="1.8"/>
                <line x1="13" y1="10" x2="13" y2="7" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round"/>
                <line x1="23" y1="10" x2="23" y2="7" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round"/>
                <rect x="12" y="19" width="4" height="4" rx="1" fill="#00F2FF" opacity="0.8"/>
                <rect x="20" y="19" width="4" height="4" rx="1" fill="#FF6B6B" opacity="0.8"/>
            </svg>
            <div class="navbar-brand-text">AGÜ <span>CAMPUS EVENTS</span></div>
        </a>

        <div class="navbar-actions">
            <!-- Login button -->
            <button class="btn-login Btn" id="openAuthModal" title="Login" style="display:none;">
                <div class="sign">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M217.9 105.9L340.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L217.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1L32 320c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM352 416l64 0c17.7 0 32-14.3 32-32l0-256c0-17.7-14.3-32-32-32l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l64 0c53 0 96 43 96 96l0 256c0 53-43 96-96 96l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/></svg>
                </div>
                <div class="text">Login</div>
            </button>

            <!-- Logout button (hidden by default) -->
            <div class="user-info hidden" id="navUserInfo">
                <button class="btn-logout Btn" id="logoutBtn" title="Logout">
                    <div class="sign">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"/></svg>
                    </div>
                    <div class="text">Logout</div>
                </button>
            </div>

            <!-- Theme toggle -->
            <label class="switch" title="Toggle Theme">
                <input id="themeToggle" type="checkbox" checked />
                <div class="slider round">
                    <div class="sun-moon">
                        <svg id="moon-dot-1" class="moon-dot" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="moon-dot-2" class="moon-dot" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="moon-dot-3" class="moon-dot" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="light-ray-1" class="light-ray" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="light-ray-2" class="light-ray" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="light-ray-3" class="light-ray" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="cloud-1" class="cloud-dark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="cloud-2" class="cloud-dark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="cloud-3" class="cloud-dark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="cloud-4" class="cloud-light" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="cloud-5" class="cloud-light" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                        <svg id="cloud-6" class="cloud-light" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"></circle></svg>
                    </div>
                    <div class="stars">
                        <svg id="star-1" class="star" viewBox="0 0 20 20"><path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path></svg>
                        <svg id="star-2" class="star" viewBox="0 0 20 20"><path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path></svg>
                        <svg id="star-3" class="star" viewBox="0 0 20 20"><path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path></svg>
                        <svg id="star-4" class="star" viewBox="0 0 20 20"><path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path></svg>
                    </div>
                </div>
            </label>
        </div>
    </nav>

    <!-- ═══════════════ MAIN SCROLL AREA ═══════════════ -->
    <div style="flex:1; overflow-y:auto;">

        <!-- ── COVER ────────────────────────────────────── -->
        <div class="club-cover" id="clubCover">
            <div class="club-cover-particles">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
            <!-- Hero info overlaid on cover -->
            <div class="club-hero">
                <div class="club-logo-ring">
                    <img id="clubLogoImg" src="" alt="Club Logo">
                </div>
                <div class="club-hero-info">
                    <h1 class="club-hero-name" id="clubName">Loading...</h1>
                    <div class="club-hero-tagline" id="clubTagline"></div>
                    <div class="club-hero-category" id="clubCategory"></div>
                </div>
            </div>
        </div>

        <!-- ── BIO CARD ──────────────────────────────────── -->
        <section class="club-bio-section" aria-label="Club Info">
            <div class="club-bio-card">
                <div class="club-stats">
                    <div class="club-stat">
                        <div class="club-stat-value" id="clubMemberCount">—</div>
                        <div class="club-stat-label">Members</div>
                    </div>
                    <div class="club-stat-divider"></div>
                    <div class="club-stat">
                        <div class="club-stat-value" id="clubEventCount">—</div>
                        <div class="club-stat-label">Events</div>
                    </div>
                    <div class="club-stat-divider"></div>
                    <div class="club-stat">
                        <div class="club-stat-value" style="font-size:1.1rem; letter-spacing:-0.01em;">AGÜ</div>
                        <div class="club-stat-label">University</div>
                    </div>
                </div>
                <div class="club-actions">
                    <button class="club-btn-follow" id="clubFollowBtn">
                        <i data-lucide="plus" style="width:16px;height:16px;"></i>
                        Follow
                    </button>
                </div>
            </div>
        </section>

        <!-- ── TABS ──────────────────────────────────────── -->
        <div class="club-tabs-wrapper">
            <nav class="club-tabs" role="tablist" aria-label="Club sections">
                <button class="club-tab active" data-tab="feed" role="tab" aria-selected="true" id="tab-feed">
                    Feed
                    <span class="club-tab-count" id="feedCountBadge">0</span>
                </button>
                <button class="club-tab" data-tab="about" role="tab" aria-selected="false" id="tab-about">
                    About
                </button>
                <button class="club-tab" data-tab="team" role="tab" aria-selected="false" id="tab-team">
                    Team
                    <span class="club-tab-count">3</span>
                </button>
            </nav>
        </div>

        <!-- ── PANELS ────────────────────────────────────── -->
        <div class="club-panels">

            <!-- Feed Panel -->
            <div class="club-panel active" id="panel-feed" role="tabpanel" aria-labelledby="tab-feed">
                <div class="club-feed-grid" id="clubFeedContainer">
                    <div class="club-loading">
                        <div class="club-spinner"></div>
                        <span>Loading events...</span>
                    </div>
                </div>
            </div>

            <!-- About Panel -->
            <div class="club-panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about">
                <div id="clubAboutContainer">
                    <div class="club-loading">
                        <div class="club-spinner"></div>
                        <span>Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Team Panel -->
            <div class="club-panel" id="panel-team" role="tabpanel" aria-labelledby="tab-team">
                <div id="clubTeamContainer">
                    <div class="club-loading">
                        <div class="club-spinner"></div>
                        <span>Loading team...</span>
                    </div>
                </div>
            </div>

        </div>

    </div><!-- end scroll area -->
</div><!-- end app-shell -->

<!-- ═══════════════ AUTH MODAL (shared) ═══════════════ -->
<div class="modal-overlay" id="authModal">
    <div class="modal-card-container" id="cardContainer">
        <div class="modal-card card-front">
            <button class="modal-close" id="closeLogin">&times;</button>
            <h2 class="modal-title">Welcome Back</h2>
            <p class="modal-subtitle">Login to your account</p>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <i data-lucide="mail" class="form-icon"></i>
                    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <i data-lucide="lock" class="form-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                </div>
                <p class="form-error" id="loginError"></p>
                <button type="submit" class="btn-submit">Login</button>
            </form>
            <p class="switch-text">
                Don't have an account yet?
                <a href="#" id="goToSignup" class="switch-link">Sign Up</a>
            </p>
        </div>
        <div class="modal-card card-back">
            <button class="modal-close" id="closeSignup">&times;</button>
            <h2 class="modal-title">Create Account</h2>
            <p class="modal-subtitle">Sign up to get started</p>
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <i data-lucide="user" class="form-icon"></i>
                    <input type="text" id="signupFirstName" placeholder="First name" required autocomplete="given-name">
                </div>
                <div class="form-group">
                    <i data-lucide="user" class="form-icon"></i>
                    <input type="text" id="signupLastName" placeholder="Last name" autocomplete="family-name">
                </div>
                <div class="form-group">
                    <i data-lucide="mail" class="form-icon"></i>
                    <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <i data-lucide="lock" class="form-icon"></i>
                    <input type="password" id="signupPassword" placeholder="Password" required autocomplete="new-password">
                </div>
                <fieldset class="account-type-fieldset">
                    <legend class="account-type-legend">I am a</legend>
                    <div class="account-type-grid">
                        <label class="account-type-card">
                            <input type="radio" name="accountType" value="student" class="account-type-input" checked>
                            <span class="account-type-card-inner">
                                <span class="account-type-icon-wrap"><i data-lucide="graduation-cap" class="account-type-icon"></i></span>
                                <span class="account-type-title">Student</span>
                                <span class="account-type-hint">Events &amp; clubs</span>
                            </span>
                        </label>
                        <label class="account-type-card">
                            <input type="radio" name="accountType" value="organizer" class="account-type-input">
                            <span class="account-type-card-inner">
                                <span class="account-type-icon-wrap"><i data-lucide="mic" class="account-type-icon"></i></span>
                                <span class="account-type-title">Organizer</span>
                                <span class="account-type-hint">Event creator</span>
                            </span>
                        </label>
                    </div>
                </fieldset>
                <p class="form-error" id="signupError"></p>
                <p class="form-success" id="signupSuccess"></p>
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
            <p class="switch-text">
                Already have an account?
                <a href="#" id="goToLogin" class="switch-link">Login</a>
            </p>
        </div>
    </div>
</div>

<script src="/js/user.js"></script>
<script src="/js/auth.js"></script>
<script>
    // Apply theme immediately to avoid flash
    const saved = localStorage.getItem('theme');
    if (saved === 'light') document.body.classList.add('light-theme');
    lucide.createIcons();
</script>
<script src="/js/clubs-data.js"></script>
<script src="/js/club.js"></script>
</body>
</html>
